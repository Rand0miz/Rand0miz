<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 396" width="1000" height="396" role="img" aria-label="Boot log: myles mcdaniel, ML infrastructure">
  <title>myles@spruce &#183; boot log</title>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#ffffff" opacity="0.028"/>
    </pattern>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/><stop offset="100%" stop-color="#56d364"/>
    </linearGradient>
    <clipPath id="scr"><rect x="1" y="1" width="998" height="394" rx="12"/></clipPath>
  </defs>

  <style>
    text  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size:13.5px; }
    .ln   { fill:#adbac7; opacity:0; animation:in .45s ease-out forwards; }
    .p    { fill:#3fb950; font-weight:700; }
    .c    { fill:#e6edf3; font-weight:600; }
    .d    { fill:#768390; }
    .v    { fill:#adbac7; }
    .ok   { fill:#3fb950; }
    .hi   { fill:#e6edf3; font-weight:700; font-size:15px; }
    .pct  { fill:#3fb950; font-weight:700; }
    .ttl  { fill:#768390; font-size:12px; letter-spacing:.6px; }
    .foot { fill:#768390; font-size:11px; letter-spacing:1.8px; opacity:0;
             animation:in .6s ease-out 3.6s forwards; }
    .track{ fill:#161b22; }
    .pfill{ fill:url(#pg); transform-box:fill-box; transform-origin:0% 50%;
             transform:scaleX(0); animation:fill 1.1s steps(20) forwards; }
    .caret{ fill:#3fb950; opacity:0; animation:in .1s linear 3.4s forwards, blink 1.05s steps(1) 3.4s infinite; }
    .crt  { animation:drift .9s linear infinite; }
    .glass{ animation:flick 5s ease-in-out infinite; }

    @keyframes in    { from { opacity:0; transform:translateX(-6px); }
                        to   { opacity:1; transform:translateX(0); } }
    @keyframes fill  { to { transform:scaleX(1); } }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes drift { from { transform:translateY(0); } to { transform:translateY(4px); } }
    @keyframes flick { 0%,100% { opacity:1; } 47% { opacity:.985; } 49% { opacity:.94; } 51% { opacity:.99; } }

    @media (prefers-reduced-motion: reduce) {
      .ln, .foot { opacity:1; transform:none; animation:none; }
      .pfill     { transform:scaleX(1); animation:none; }
      .caret     { opacity:1; animation:none; }
      .crt, .glass { animation:none; }
    }
    @media (prefers-color-scheme: light) {
      .scrn  { fill:#f6f8fa; }
      .chrome{ fill:#eaeef2; }
      .ln, .v{ fill:#24292f; }
      .c, .hi{ fill:#0f1419; }
      .d, .ttl, .foot { fill:#6e7781; }
      .track { fill:#e4e8ed; }
      .crt   { opacity:0; }
    }
  </style>

  <g clip-path="url(#scr)" class="glass">
    <rect class="scrn" x="0" y="0" width="1000" height="396" fill="#010409"/>
    <rect class="chrome" x="0" y="0" width="1000" height="36" fill="#0d1117"/>
    <circle cx="24" cy="18" r="5.5" fill="#f85149"/>
    <circle cx="44" cy="18" r="5.5" fill="#d29922"/>
    <circle cx="64" cy="18" r="5.5" fill="#3fb950"/>
    <text class="ttl" x="500.0" y="22" text-anchor="middle">myles@spruce: ~/profile &#8212; zsh</text>
    <line x1="0" y1="36" x2="1000" y2="36" stroke="#21262d" stroke-width="1"/>

    <text class="ln" x="30" y="74" style="animation-delay:0.30s"><tspan class="p">$</tspan> <tspan class="c">./boot --profile</tspan></text>
    <text class="ln" x="30" y="99" style="animation-delay:0.56s"><tspan fill="#3fb950">[ ok ]</tspan> <tspan class="d">probing /dev/gpu .............................</tspan> <tspan class="v">NVIDIA &#183; CUDA 12</tspan></text>
    <text class="ln" x="30" y="124" style="animation-delay:0.82s"><tspan fill="#3fb950">[ ok ]</tspan> <tspan class="d">loading transformers .........................</tspan> <tspan class="v">sdpa attention</tspan></text>
    <text class="ln" x="30" y="149" style="animation-delay:1.08s"><tspan fill="#3fb950">[ ok ]</tspan> <tspan class="d">mounting corpus ..............................</tspan> <tspan class="v">book.txt &#183; 422 KB</tspan></text>
    <text class="ln" x="30" y="174" style="animation-delay:1.34s"><tspan fill="#d29922">[warn]</tspan> <tspan class="d">context window exceeded ......................</tspan> <tspan class="v">108k tokens &gt; 32k</tspan></text>
    <text class="ln" x="30" y="199" style="animation-delay:1.60s"><tspan fill="#3fb950">[ ok ]</tspan> <tspan class="d">spruce: attention scoring ....................</tspan> <tspan class="v">4096-d features</tspan></text>
    <text class="ln" x="30" y="224" style="animation-delay:1.86s"><tspan class="ok">[ &#8230; ]</tspan> <tspan class="d">compiling context ............................</tspan></text>
    <rect class="track" x="460" y="213" width="220" height="12" rx="6"/>
    <rect class="pfill" x="460" y="213" width="220" height="12" rx="6" style="animation-delay:1.86s"/>
    <text class="ln pct" x="694" y="224" style="animation-delay:3.01s">0.6%</text>
    <text class="ln" x="30" y="249" style="animation-delay:2.12s"><tspan fill="#3fb950">[ ok ]</tspan> <tspan class="d">emitted candidate blocks .....................</tspan> <tspan class="v">4 of 1,214</tspan></text>
    <text class="ln" x="30" y="274" style="animation-delay:2.38s"><tspan fill="#3fb950">[ ok ]</tspan> <tspan class="d">needle intact ................................</tspan> <tspan class="v">&quot;nickel-aluminium&quot;</tspan></text>
    <text class="ln" x="30" y="324" style="animation-delay:2.90s"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text>
    <text class="ln" x="30" y="349" style="animation-delay:3.16s"><tspan class="p">&#8250;</tspan> <tspan class="hi">myles mcdaniel &#8212; ml infrastructure</tspan></text>
    <rect class="caret" x="355" y="336" width="9" height="16" rx="1"/>

    <text class="foot" x="30" y="378">EXIT 0 &#183; 422 KB IN &#183; 4 BLOCKS OUT &#183; NEEDLE INTACT</text>

    <rect class="crt" x="0" y="-4" width="1000" height="404" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="998" height="394" rx="12" fill="none" stroke="#21262d" stroke-width="1.5"/>
</svg>
